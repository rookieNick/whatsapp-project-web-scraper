<!DOCTYPE html>
<html lang="en">

<head>
    <title>WhatsApp Scraper</title>
    <link rel="stylesheet" href="style.css">
    <script src="order.js"></script>
    <script src="scrapeBtn.js"></script>
    <script src="exportBtn.js"></script>
</head>

<div id="incorrectMessages"></div>


<div class="controls">
    <h1>WhatsApp Scraper</h1>
    <label for="chatName">Chat Name:</label>
    <input type="text" id="chatName" placeholder="Enter Chat Name" required>

    <label for="targetDate">Target Date:</label>
    <input type="date" id="targetDate" required>

    <button id="scrapeBtn">Retrieve WhatsApp Messages</button>
</div>

<div class="controls">
    <h1>Export excel</h1>
    <!-- Start Date & Time -->
    <label for="startDateTime">Customer Message Start Date & Time:</label>
    <input type="datetime-local" id="startDateTime" required>

    <!-- End Date & Time -->
    <label for="endDateTime">Customer Message End Date & Time:</label>
    <input type="datetime-local" id="endDateTime" required>

    <label for="orderDate">Order Date:</label>
    <input type="date" id="orderDate" required>

    <label for="orderArea">Area:</label>
    <select id="orderArea">
        <option value="">All Area</option>
        <option value="FJ">FJ</option>
        <option value="G">G</option>
        <option value="BL">BL</option>
        <option value="PT">PT</option>
        <option value="BW">BW</option>
    </select>

    <button id="exportBtn">Export Excel</button>
</div>


<body>


    <div class="container">
        <h1>Order Report</h1>

        <div class="controls">
            <!-- Filter by Customer Message Start Date -->
            <label for="startDateFilter">Customer Message Start Date:</label>
            <input type="datetime-local" id="startDateFilter">

            <!-- Filter by Customer Message End Date -->
            <label for="endDateFilter">Customer Message End Date:</label>
            <input type="datetime-local" id="endDateFilter">

            <!-- Filter by Order Date -->
            <label for="orderDateFilter">Filter by Order Date:</label>
            <input type="date" id="orderDateFilter"> <!-- Renamed to reflect that it's for Order Date -->

            <label for="locationFilter">Filter by Area:</label>
            <select id="locationFilter">
                <option value="">All Area</option>
                <option value="FJ">FJ</option>
                <option value="G">G</option>
                <option value="BL">BL</option>
                <option value="PT">PT</option>
                <option value="BW">BW</option>
            </select>

            <button id="filterBtn">Apply Filter</button>
            <button id="showAllBtn">Show All</button>
        </div>

        <hr>

        <div id="orderList"></div>
        <nav id="paginationControls" class="pagination-controls" aria-label="Order pages" hidden>
            <button id="prevPageBtn" type="button">Previous</button>
            <span id="pageIndicator" aria-live="polite"></span>
            <button id="nextPageBtn" type="button">Next</button>
        </nav>
    </div>


</body>

</html>
